version: '3.7'

volumes:
  volume-mysql:
  volume-arcturus-maven-repo:
  volume-arcturus-target:
  volume-nitro-converter-node-modules:
  volume-nitro-react-node-modules:

services:
  arcturus:
    container_name: arcturus
    build:
      context: emulator
    entrypoint: ["/bin/sh", "/app/scripts/build.sh"]
    volumes:
      - ./emulator/:/app/
      - volume-arcturus-target:/app/arcturus/target
      - volume-arcturus-maven-repo:/root/.m2
    ports:
      - 3000:3000
      - 3001:3001
      - 2096:2096
    labels:
          - "traefik.enable=true"
          - "traefik.tcp.routers.arcturus-ws.rule=HostSNI(`*`)"
          - "traefik.tcp.routers.arcturus-ws.entrypoints=https"
          - "traefik.tcp.routers.arcturus-ws.service=arcturus-ws-svc"
          - "traefik.tcp.routers.arcturus-ws.tls=true"
          - "traefik.tcp.services.arcturus-ws-svc.loadbalancer.server.port=3000"
    depends_on:
      - mysql
    networks:
      - coolify

  nitro:
    container_name: nitro
    build:
      context: nitro
    entrypoint: ["/bin/sh", "/app/scripts/build.sh"]
    volumes:
      - ./nitro/:/app/
      - volume-nitro-converter-node-modules:/app/nitro-converter/node_modules
      - volume-nitro-react-node-modules:/app/nitro-react/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.habbo.rule=Host(`habbo.aplicacoescompartilhadas.vps-kinghost.net`)"
      - "traefik.http.routers.habbo.entrypoints=https"
      - "traefik.http.routers.habbo.tls.certresolver=letsencrypt"
      # MUDAMOS DE 5154 PARA 8080
      - "traefik.http.services.habbo.loadbalancer.server.port=5154" 
      - "traefik.http.routers.habbo.service=habbo"
      - "traefik.http.services.habbo.loadbalancer.passhostheader=true"
      - "traefik.http.routers.assets.rule=Host(`assets.aplicacoescompartilhadas.vps-kinghost.net` || `habbo.aplicacoescompartilhadas.vps-kinghost.net`) && PathPrefix(`/gamedata`, `/gordon`, `/bundled`)"
      - "traefik.http.routers.assets.entrypoints=https"
      - "traefik.http.routers.assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.assets.service=assets-service"
      - "traefik.http.services.assets-service.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.assets-strip.stripprefix.prefixes=/gamedata,/gordon,/bundled"
      - "traefik.http.routers.assets.middlewares=assets-strip"
    ports:
      - 1080:5154
      - 9080:8080
      - 8081:8081
    networks:
      - coolify
      
  mysql:
    container_name: mysql
    image: mariadb:10.6
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=arcturus_root_pw
      - MYSQL_USER=arcturus_user
      - MYSQL_PASSWORD=arcturus_pw
      - MYSQL_DATABASE=arcturus
    volumes:
      - volume-mysql:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
      - ./mysql/dumps:/docker-entrypoint-initdb.d
    ports:
      - 13306:3306
    networks:
      - coolify

networks:
  coolify:
    external: true
